# Proxy-side pieces for the loan app (put in /etc/nginx/sites-available/ on
# proxy .1; lsyncd mirrors /etc/nginx to proxy .5).
#
# 1) The upstream. Primary/backup rather than least_conn: there are only a
#    handful of users, and sending each user's requests to one node keeps
#    their file-based session valid. Node .4 takes over only if .3 fails
#    (users then log in again once).
upstream loan_backend {
    server 10.10.10.3:80 max_fails=3 fail_timeout=5s;
    server 10.10.10.4:80 backup;
    keepalive 8;
}

# 2) REHEARSAL site. A different server_name, so live traffic for
#    dmcmanagement.duckdns.org is untouched. Forwards to the app nodes with
#    the real Host header so the app nodes see exactly what they will see
#    after cutover. Same TLS options, ModSecurity and rate limit as the
#    live `lt` site. Reach it from an admin machine with:
#      curl -k --resolve loan-rehearsal.invalid:443:10.10.10.1 https://loan-rehearsal.invalid/
#    Delete this block after the rehearsal.
server {
    listen 443 ssl;
    server_name loan-rehearsal.invalid;

    ssl_certificate     /etc/letsencrypt/live/dmcmanagement.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmcmanagement.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    proxy_hide_header Server;
    allow 10.10.0.0/16;
    deny all;

    access_log /var/log/nginx/loan-rehearsal.access.log;
    error_log  /var/log/nginx/loan-rehearsal.error.log;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    location / {
        limit_req zone=all burst=20 nodelay;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://loan_backend;

        proxy_set_header Host dmcmanagement.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# 3) CUTOVER (separate, later step): in the live `lt` site's
#    `location /` block, change
#        proxy_pass http://10.10.2.2:80;
#    to
#        proxy_pass http://loan_backend;
#    then `nginx -t && nginx -s reload`. Rollback = change it back and reload.
#    Also replace the `Upgrade`/`Connection "upgrade"` header lines with
#    `proxy_set_header Connection "";` so upstream keepalive is used.
