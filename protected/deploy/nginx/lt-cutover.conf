# Replacement for /etc/nginx/sites-available/lt (the loan app's domain),
# modelled on the `cipherlab` (HumHub) site: same TLS/HTTP2 settings, same
# security headers, proxy_next_upstream, ModSecurity, rate limit.
# Differences from cipherlab, on purpose:
#  * upstream is primary/backup (`loan_backend`, defined in loan-rehearsal),
#    not least_conn: sessions are per-node files and the loan KeyDB caches
#    are independent per node, so spreading one user's requests over both
#    nodes would show stale dashboard totals and drop sessions.
#  * no proxy_cache: pages are per-user and private.
# NOT enabled. Cutover = keep a backup of `lt`, install this as `lt`,
# `nginx -t && systemctl reload nginx`. Rollback = put the backup back + reload.

server {
    listen 80;
    listen [::]:80;
    server_name dmcmanagement.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/lt.access.log;
    error_log  /var/log/nginx/lt.error.log;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dmcmanagement.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dmcmanagement.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmcmanagement.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    proxy_hide_header Server;

    access_log /var/log/nginx/lt.access.log;
    error_log  /var/log/nginx/lt.error.log;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    location / {
        limit_req zone=all burst=20 nodelay;
        proxy_pass http://loan_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
