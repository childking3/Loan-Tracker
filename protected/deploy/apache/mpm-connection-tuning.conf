ListenBacklog 4096
Timeout 60
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 1000
HostnameLookups Off

<IfModule mpm_prefork_module>
    ServerLimit             256
    MaxRequestWorkers       256
    StartServers            16
    MinSpareServers         16
    MaxSpareServers         48
    MaxConnectionsPerChild  10000
</IfModule>

<IfModule mpm_event_module>
    ServerLimit             8
    ThreadLimit             64
    ThreadsPerChild         64
    MaxRequestWorkers       512
    MinSpareThreads         64
    MaxSpareThreads         192
    AsyncRequestWorkerFactor 2
    MaxConnectionsPerChild  10000
</IfModule>
