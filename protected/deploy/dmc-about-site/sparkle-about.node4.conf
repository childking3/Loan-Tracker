# Static "About" site for dmcsparklesservices.com, served from the app
# nodes like every other vhost here (was previously served straight off
# the proxy's local disk at /var/www/html - see CODEBASE.md 2026-09-27).
# No PHP: plain static HTML, so no php-fpm handler and no upload dir.
#
# Filename deliberately sorts after humhub.conf and loan-management.conf:
# with no matching Host header, Apache falls back to the FIRST vhost
# defined for this IP:port pair (alphabetical by sites-enabled filename),
# which must stay humhub.conf, unchanged from today.
<VirtualHost 10.10.10.4:80 10.10.2.4:80>
    ServerName dmcsparklesservices.com
    ServerAlias www.dmcsparklesservices.com

    DocumentRoot /var/www/dmc-about-site

    <Directory /var/www/dmc-about-site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Defense in depth only: no .php file is ever placed here and no
    # handler is configured for this vhost, so PHP can't execute either
    # way - matches loan-management.conf's belt-and-braces denial.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/dmc-about-error-node4.log
    CustomLog ${APACHE_LOG_DIR}/dmc-about-access-node4.log combined
</VirtualHost>
