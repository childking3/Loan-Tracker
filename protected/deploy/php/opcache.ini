; Loan app's own opcache settings, installed as /etc/php/8.4/loan/conf.d/10-opcache.ini
; (a real file, NOT a symlink to mods-available/opcache.ini: that shared file
; sets validate_timestamps=0 and loads AFTER php.ini, silently overriding it).
zend_extension=opcache.so
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
; a deploy takes effect within revalidate_freq seconds
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=off
opcache.jit_buffer_size=0
