[PHP]
expose_php = Off
memory_limit = 64M
max_execution_time = 30
post_max_size = 12M
upload_max_filesize = 10M
max_file_uploads = 2

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = syslog
syslog.ident = loan-php
zend.assertions = -1

allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail
open_basedir = /var/www/loan-management/:/run/loan-app/
upload_tmp_dir = /run/loan-app/tmp
sys_temp_dir = /run/loan-app/tmp

; PHP's stock Debian config never garbage-collects custom session dirs.
; Matches user.authTimeout / session.timeout (1800) in web.php.
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1800

realpath_cache_size = 1M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
; Timestamps validated (unlike the shared HumHub FPM, which never
; revalidates): a deploy takes effect within revalidate_freq seconds.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = off
