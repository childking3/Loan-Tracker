; Dedicated PHP-FPM master for the loan app. Runs beside (not inside) the
; shared php8.4-fpm that serves HumHub, so deploying/tuning this never
; reloads HumHub's workers and it gets its own opcache.
[global]
pid = /run/loan-app/php-fpm.pid
error_log = syslog
syslog.ident = loan-php-fpm
daemonize = no

[loan]
user = loanapp
group = loanapp
listen = /run/php/loan-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
clear_env = yes
