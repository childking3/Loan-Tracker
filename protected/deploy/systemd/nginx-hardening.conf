[Service]
NoNewPrivileges=true
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID

ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/run
ReadWritePaths=/var/log/nginx
ReadWritePaths=/var/cache/nginx
ReadWritePaths=-/var/cache/modsecurity
ReadWritePaths=-/opt/modsecurity/var/upload

PrivateTmp=true
PrivateDevices=true
PrivateIPC=true
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=false

RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SocketBindDeny=any
SocketBindAllow=tcp:80
SocketBindAllow=tcp:443

SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@clock @mount @reboot @swap @debug @module @raw-io @cpu-emulation @obsolete

UMask=0027
LimitNOFILE=65535
